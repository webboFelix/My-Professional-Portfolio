name: DevSecOps

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Software composition analysis (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [backend, frontend, updater]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - name: Fail on moderate or higher dependency vulnerabilities
        run: npm audit --audit-level=moderate

  static-analysis:
    name: Static code analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [frontend, updater]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  application-build:
    name: Production build (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [frontend, updater]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: npm run build

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          post-processed-sarif-path: codeql-results
      - name: Fail on medium or higher CodeQL security findings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          function sarifFiles(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const entryPath = path.join(directory, entry.name);
              return entry.isDirectory() ? sarifFiles(entryPath) : entry.name.endsWith(".sarif") ? [entryPath] : [];
            });
          }

          const files = sarifFiles("codeql-results");
          if (files.length === 0) throw new Error("CodeQL did not produce SARIF results.");

          const findings = [];
          for (const file of files) {
            const report = JSON.parse(fs.readFileSync(file, "utf8"));
            for (const run of report.runs ?? []) {
              const rules = run.tool?.driver?.rules ?? [];
              for (const result of run.results ?? []) {
                const rule = rules[result.ruleIndex ?? -1];
                const severity = Number(rule?.properties?.["security-severity"]);
                if (Number.isFinite(severity) && severity >= 4) {
                  findings.push(`${result.ruleId} (${severity})`);
                }
              }
            }
          }

          if (findings.length > 0) {
            console.error(`Found ${findings.length} CodeQL finding(s) with security severity >= 4:`);
            console.error([...new Set(findings)].join("\n"));
            process.exit(1);
          }
          console.log("No CodeQL findings with medium or higher security severity.");
          NODE

  secret-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: portfolio-sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-sbom
          path: portfolio-sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Start frontend
        working-directory: frontend
        run: |
          npm start -- --hostname 0.0.0.0 > /tmp/portfolio-next.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/portfolio-next.log
          exit 1
      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:3000
          fail_action: false
          allow_issue_writing: false
      - name: Download ZAP report
        uses: actions/download-artifact@v4
        with:
          name: zap_scan
          path: zap-reports
      - name: Fail on medium or higher ZAP alerts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          function findReports(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const entryPath = path.join(directory, entry.name);
              return entry.isDirectory() ? findReports(entryPath) : entry.name === "report_json.json" ? [entryPath] : [];
            });
          }

          const reports = findReports("zap-reports");
          if (reports.length === 0) throw new Error("ZAP did not provide report_json.json.");

          const blockingAlerts = [];
          for (const file of reports) {
            const report = JSON.parse(fs.readFileSync(file, "utf8"));
            for (const site of report.site ?? []) {
              for (const alert of site.alerts ?? []) {
                if (Number(alert.riskcode) >= 2) {
                  blockingAlerts.push(`${alert.riskdesc}: ${alert.alert}`);
                }
              }
            }
          }

          if (blockingAlerts.length > 0) {
            console.error(`Found ${blockingAlerts.length} ZAP alert(s) with medium or higher risk:`);
            console.error([...new Set(blockingAlerts)].join("\n"));
            process.exit(1);
          }
          console.log("No ZAP alerts with medium or higher risk.");
          NODE

  checks-passed:
    name: All validation and security checks passed
    runs-on: ubuntu-latest
    needs:
      - dependency-scan
      - static-analysis
      - application-build
      - sast
      - secret-scan
      - sbom
      - dast
    steps:
      - run: echo "All checks passed with no medium-or-higher security findings."

  image-build-scan-publish:
    name: Build, scan, and publish Docker images
    runs-on: ubuntu-latest
    needs: checks-passed
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image
        run: docker build --pull --tag portfolio-frontend:${{ github.sha }} ./frontend
      - name: Build API image
        run: docker build --pull --tag portfolio-api:${{ github.sha }} ./backend
      - name: Scan frontend image (block medium or higher)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: portfolio-frontend:${{ github.sha }}
          format: table
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
      - name: Scan API image (block medium or higher)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: portfolio-api:${{ github.sha }}
          format: table
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish scanned images to GitHub Container Registry
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "portfolio-frontend:${GITHUB_SHA}" "${repository}-frontend:${GITHUB_SHA}"
          docker tag "portfolio-api:${GITHUB_SHA}" "${repository}-api:${GITHUB_SHA}"
          docker push "${repository}-frontend:${GITHUB_SHA}"
          docker push "${repository}-api:${GITHUB_SHA}"
          docker tag "portfolio-frontend:${GITHUB_SHA}" "${repository}-frontend:latest"
          docker tag "portfolio-api:${GITHUB_SHA}" "${repository}-api:latest"
          docker push "${repository}-frontend:latest"
          docker push "${repository}-api:latest"

  vercel-deploy:
    name: Deploy public frontend to Vercel
    runs-on: ubuntu-latest
    needs:
      - checks-passed
      - image-build-scan-publish
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Vercel deployment secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || (echo "Missing VERCEL_TOKEN repository secret." && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "Missing VERCEL_ORG_ID repository secret." && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "Missing VERCEL_PROJECT_ID repository secret." && exit 1)
      - name: Deploy production frontend
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
